<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BensLogs</title>
    <meta name="description" content="BensLogs. New site in progress.">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #0a0a0a;
        --muted: #6b6b6b;
        --accent: #0a0a0a;
        --drop-core: rgba(10, 10, 10, 0.9);
        --drop-fade: rgba(10, 10, 10, 0.1);
        --ripple: rgba(10, 10, 10, 0.45);
        --surface-line: rgba(10, 10, 10, 0.14);
        --surface-glow: rgba(10, 10, 10, 0.08);
        --halo: rgba(10, 10, 10, 0.05);
        --line: #e0e0e0;
        --line-strong: #bdbdbd;
        --surface: 74vh;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --ink: #ffffff;
          --muted: #9a9a9a;
          --accent: #ffffff;
          --drop-core: rgba(255, 255, 255, 0.92);
          --drop-fade: rgba(255, 255, 255, 0.14);
          --ripple: rgba(255, 255, 255, 0.5);
          --surface-line: rgba(255, 255, 255, 0.18);
          --surface-glow: rgba(255, 255, 255, 0.1);
          --halo: rgba(255, 255, 255, 0.06);
          --line: #2a2a2a;
          --line-strong: #4a4a4a;
        }
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html {
        text-rendering: optimizeLegibility;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Space Grotesk", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .halo {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            58% 58% at 50% 44%,
            var(--halo),
            transparent 70%
          );
        animation: breathe 9s ease-in-out infinite;
      }

      .water {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .drop,
      .ripple,
      .splash {
        position: absolute;
        left: var(--x);
        top: var(--surface);
        opacity: 0;
      }

      .drop {
        width: 11px;
        height: 17px;
        margin-left: -5.5px;
        margin-top: -8px;
        border-radius: var(--br-tl, 50%) var(--br-tr, 50%) var(--br-br, 50%)
          var(--br-bl, 0);
        background: linear-gradient(
          var(--grad, 165deg),
          var(--drop-core),
          var(--drop-fade)
        );
        box-shadow: 0 0 10px var(--drop-fade);
        filter: blur(var(--drop-blur, 0px));
        animation: fall var(--dur) var(--delay) ease-in infinite;
      }

      .drop::after {
        content: "";
        position: absolute;
        top: var(--hl-top, 14%);
        left: var(--hl-left, 18%);
        width: var(--hl-size, 26%);
        height: var(--hl-size, 26%);
        border-radius: 50%;
        background: rgba(255, 255, 255, var(--hl-alpha, 0.85));
      }

      .ripple {
        width: 90px;
        height: 90px;
        margin-left: -45px;
        margin-top: -45px;
        border: 1px solid var(--ripple);
        border-radius: 50%;
        animation: ripple var(--dur) var(--delay) ease-out infinite;
      }

      .splash {
        width: 10px;
        height: 10px;
        margin-left: -5px;
        margin-top: -5px;
        border-radius: 50%;
        background: var(--ripple);
        animation: splash var(--dur) var(--delay) ease-out infinite;
      }

      .surface {
        position: fixed;
        left: 0;
        right: 0;
        top: var(--surface);
        height: 1px;
        z-index: 0;
        background: var(--surface-line);
        box-shadow: 0 0 24px 4px var(--surface-glow);
      }

      .e1 {
        --x: 16%;
        --dur: 7.5s;
        --delay: 2.4s;
        --br-tl: 50%;
        --br-tr: 50%;
        --br-br: 50%;
        --br-bl: 0%;
        --grad: 165deg;
        --hl-top: 14%;
        --hl-left: 18%;
        --hl-size: 26%;
        --hl-alpha: 0.85;
        --rot: -38deg;
        --fall-dist: 38vh;
        --drop-alpha: 0.55;
        --drop-blur: 0.7px;
        --rip-alpha: 0.35;
        --rip-scale: 1.2;
      }

      .e2 {
        --x: 78%;
        --dur: 9.2s;
        --delay: 4.9s;
        --br-tl: 50%;
        --br-tr: 50%;
        --br-br: 50%;
        --br-bl: 16%;
        --grad: 200deg;
        --hl-top: 22%;
        --hl-left: 24%;
        --hl-size: 30%;
        --hl-alpha: 0.7;
        --rot: -50deg;
        --fall-dist: 54vh;
        --drop-alpha: 1;
        --drop-blur: 0px;
        --rip-alpha: 0.75;
        --rip-scale: 2.3;
      }

      .e3 {
        --x: 38%;
        --dur: 8.1s;
        --delay: 7.2s;
        --br-tl: 56%;
        --br-tr: 56%;
        --br-br: 44%;
        --br-bl: 0%;
        --grad: 150deg;
        --hl-top: 10%;
        --hl-left: 16%;
        --hl-size: 24%;
        --hl-alpha: 0.9;
        --rot: -45deg;
        --fall-dist: 46vh;
        --drop-alpha: 0.8;
        --drop-blur: 0.3px;
        --rip-alpha: 0.5;
        --rip-scale: 1.8;
      }

      .e4 {
        --x: 61%;
        --dur: 8.8s;
        --delay: 9s;
        --br-tl: 50%;
        --br-tr: 64%;
        --br-br: 38%;
        --br-bl: 0%;
        --grad: 180deg;
        --hl-top: 16%;
        --hl-left: 26%;
        --hl-size: 22%;
        --hl-alpha: 0.75;
        --rot: -58deg;
        --fall-dist: 30vh;
        --drop-alpha: 0.5;
        --drop-blur: 1px;
        --rip-alpha: 0.3;
        --rip-scale: 1.1;
      }

      .intro {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .intro-drop,
      .intro-flash,
      .intro-ring {
        grid-area: 1 / 1;
        opacity: 0;
      }

      .intro-drop {
        width: 40px;
        height: 60px;
        border-radius: 50% 50% 50% 0;
        background: linear-gradient(165deg, var(--drop-core), var(--drop-fade));
        box-shadow: 0 0 28px var(--drop-fade);
        animation: intro-fall 1.25s cubic-bezier(0.55, 0, 0.85, 0.3) both;
      }

      .intro-drop::after {
        content: "";
        position: absolute;
        top: 12%;
        left: 16%;
        width: 30%;
        height: 30%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
      }

      .intro-ring {
        width: 150px;
        height: 150px;
        border: 1.5px solid var(--ripple);
        border-radius: 50%;
        animation: intro-ring 0.9s 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .intro-flash {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--ripple);
        animation: intro-flash 0.6s 0.98s ease-out both;
      }

      main {
        position: relative;
        z-index: 1;
        max-width: 40rem;
        text-align: center;
      }

      main > * {
        animation: rise 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .eyebrow {
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--muted);
        animation-delay: 1250ms;
      }

      .eyebrow::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-right: 0.7em;
        border-radius: 50%;
        vertical-align: 2px;
        background: var(--accent);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .title {
        margin-top: 1.4rem;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2.6rem, 10vw, 4.75rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.015em;
        animation-delay: 1400ms;
      }

      .title em {
        font-style: italic;
      }

      .sub {
        margin-top: 1.1rem;
        font-size: 1.02rem;
        color: var(--muted);
        animation-delay: 1600ms;
      }

      .signup {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin-top: 1.6rem;
        animation-delay: 1800ms;
      }

      .signup input {
        width: min(240px, 55vw);
        font: inherit;
        font-size: 0.9rem;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        padding: 0.55rem 1.1rem;
        outline: none;
        transition: border-color 200ms ease;
      }

      .signup input::placeholder {
        color: var(--muted);
      }

      .signup input:focus {
        border-color: var(--ink);
      }

      .signup button {
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--bg);
        background: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.55rem 1.2rem;
        cursor: pointer;
        transition: opacity 150ms ease;
      }

      .signup button:hover {
        opacity: 0.8;
      }

      .signup button:disabled {
        opacity: 0.4;
        cursor: wait;
      }

      .signup-msg {
        margin-top: 0.9rem;
        min-height: 1.2em;
        font-size: 0.85rem;
        color: var(--muted);
        animation-delay: 2000ms;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.07);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes fall {
        0% {
          transform: translateY(calc(var(--fall-dist, 46vh) * -1))
            rotate(var(--rot, -45deg));
          opacity: 0;
        }
        5% {
          opacity: var(--drop-alpha, 1);
        }
        26% {
          transform: translateY(0) rotate(var(--rot, -45deg));
          opacity: var(--drop-alpha, 1);
        }
        30% {
          transform: translateY(0) rotate(var(--rot, -45deg));
          opacity: 0;
        }
        100% {
          transform: translateY(0) rotate(var(--rot, -45deg));
          opacity: 0;
        }
      }

      @keyframes ripple {
        0% {
          transform: scale(0.05);
          opacity: 0;
        }
        26% {
          transform: scale(0.16);
          opacity: var(--rip-alpha, 0.6);
        }
        100% {
          transform: scale(var(--rip-scale, 1.8));
          opacity: 0;
        }
      }

      @keyframes splash {
        0% {
          transform: scale(0.2);
          opacity: 0;
        }
        24% {
          transform: scale(0.3);
          opacity: 0.4;
        }
        27% {
          transform: scale(1.05);
          opacity: 0.9;
        }
        34% {
          transform: scale(1.7);
          opacity: 0;
        }
        100% {
          transform: scale(1.7);
          opacity: 0;
        }
      }

      @keyframes intro-fall {
        0% {
          transform: translateY(-52vh) rotate(-45deg);
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        78% {
          transform: translateY(0) rotate(-45deg);
          opacity: 1;
        }
        100% {
          transform: translateY(0) rotate(-45deg);
          opacity: 0;
        }
      }

      @keyframes intro-ring {
        0% {
          transform: scale(0.08);
          opacity: 0;
        }
        12% {
          opacity: 0.8;
        }
        100% {
          transform: scale(1.7);
          opacity: 0;
        }
      }

      @keyframes intro-flash {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        30% {
          opacity: 0.9;
        }
        100% {
          transform: scale(1.9);
          opacity: 0;
        }
      }

      @media (prefers-color-scheme: dark) {
        .title {
          text-shadow: 0 0 40px rgba(255, 255, 255, 0.12);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .intro,
        .halo,
        .water,
        .surface,
        .eyebrow::before {
          display: none;
        }

        main > * {
          animation: none;
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="intro" aria-hidden="true">
      <span class="intro-drop"></span>
      <span class="intro-flash"></span>
      <span class="intro-ring"></span>
    </div>
    <div class="halo" aria-hidden="true"></div>
    <div class="water" aria-hidden="true">
      <span class="drop e1"></span>
      <span class="drop e2"></span>
      <span class="drop e3"></span>
      <span class="drop e4"></span>
      <span class="ripple e1"></span>
      <span class="ripple e2"></span>
      <span class="ripple e3"></span>
      <span class="ripple e4"></span>
      <span class="splash e1"></span>
      <span class="splash e2"></span>
      <span class="splash e3"></span>
      <span class="splash e4"></span>
    </div>
    <div class="surface" aria-hidden="true"></div>
    <main>
      <p class="eyebrow">benslogs.dev</p>
      <h1 class="title">Bens<em>Logs</em></h1>
      <p class="sub">New site in progress.</p>
      <form class="signup" id="signup" novalidate>
        <input type="email" id="signup-email" name="email" placeholder="you@example.com" aria-label="Email address" required>
        <button type="submit">Subscribe</button>
      </form>
      <p class="signup-msg" id="signup-msg" role="status"></p>
    </main>

    <script type="module">
      const SUBSCRIBE_URL = "https://admin-sage-nine-39.vercel.app/api/subscribe";

      const form = document.getElementById("signup");
      const email = document.getElementById("signup-email");
      const msg = document.getElementById("signup-msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const value = email.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          msg.textContent = "Enter a valid email address.";
          email.focus();
          return;
        }
        const btn = form.querySelector("button");
        btn.disabled = true;
        msg.textContent = "";
        try {
          const res = await fetch(SUBSCRIBE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: value }),
          });
          const data = await res.json().catch(() => ({}));
          msg.textContent = res.ok
            ? "You're on the list."
            : data.error || "Couldn't subscribe — try again.";
          if (res.ok) form.reset();
        } catch {
          msg.textContent = "Couldn't subscribe — try again.";
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
