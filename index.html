<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BensLogs — Building</title>
    <meta
      name="description"
      content="BensLogs is under construction. The site is being rebuilt."
    >
    <meta name="theme-color" content="#07030f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    >
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark;
        --bg: #07030f;
        --fg: #f5ecff;
        --muted: rgba(245, 236, 255, 0.45);
        --accent: #b06dff;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Outfit", system-ui, sans-serif;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
      }

      .orb-a {
        width: 420px;
        height: 420px;
        top: -140px;
        left: -140px;
        background: rgba(176, 109, 255, 0.22);
      }

      .orb-b {
        width: 380px;
        height: 380px;
        bottom: -160px;
        right: -120px;
        background: rgba(140, 200, 255, 0.14);
      }

      .wrap {
        position: relative;
        text-align: center;
        padding: 2rem;
      }

      .logo {
        font-size: clamp(2rem, 7vw, 3.25rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 1.1rem;
      }

      .logo span {
        background: linear-gradient(120deg, #d2a9ff, #b06dff 60%, #7fd4ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.55rem 1.1rem;
        border-radius: 999px;
        border: 0.5px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 2.2rem;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }

      .tagline {
        font-size: 0.98rem;
        font-weight: 300;
        color: var(--muted);
        line-height: 1.6;
        max-width: 32rem;
        margin: 0 auto;
      }

      .tagline a {
        color: #d2a9ff;
        text-decoration: none;
        border-bottom: 0.5px solid rgba(176, 109, 255, 0.4);
        transition: color 200ms ease;
      }

      .tagline a:hover {
        color: var(--accent);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>

    <main class="wrap">
      <h1 class="logo">Bens<span>Logs</span></h1>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        Building
      </div>
      <p class="tagline">
        The site is being rebuilt. The previous one lives at
        <a href="/old/">/old/</a>.
      </p>
    </main>
  </body>
</html>
