<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BensLogs</title>
    <meta name="description" content="BensLogs. New site in progress.">
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      :root {
        color-scheme: light dark;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        overflow: hidden;
        background: #fff;
        color: #111;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .spline {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.28;
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        text-align: center;
      }

      main > * {
        animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      h1 {
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      p {
        margin-top: 0.9rem;
        font-size: 0.95rem;
        color: #888;
      }

      p:nth-of-type(1) {
        animation-delay: 90ms;
      }

      p:nth-of-type(2) {
        animation-delay: 180ms;
      }

      a {
        color: inherit;
        text-decoration: none;
        background-image: linear-gradient(currentColor, currentColor);
        background-size: 0% 1px;
        background-repeat: no-repeat;
        background-position: 0 100%;
        transition: background-size 220ms ease;
      }

      a:hover {
        background-size: 100% 1px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0b0b;
          color: #f2f2f2;
        }

        p {
          color: #777;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spline {
          display: none;
        }

        main > * {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="spline" class="spline" aria-hidden="true"></canvas>
    <main>
      <h1>BensLogs</h1>
      <p>Building.</p>
      <p>
        <a href="/old/">Previous site</a>
      </p>
    </main>

    <script type="module">
      const SCENE_URL =
        "https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode";
      const canvas = document.getElementById("spline");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

      if (canvas && !reduced.matches) {
        import("https://unpkg.com/@splinetool/runtime@1.0.93/build/runtime.js")
          .then(({ Application }) => {
            const spline = new Application(canvas);
            spline.load(SCENE_URL).catch(() => {
              canvas.hidden = true;
            });
          })
          .catch(() => {
            canvas.hidden = true;
          });
      }
    </script>
  </body>
</html>
