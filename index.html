<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BensLogs</title>
    <meta name="description" content="BensLogs. Fresh logs, dropping soon.">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #0a0a0a;
        --muted: #6b6b6b;
        --accent: #0a0a0a;
        --drop-core: rgba(10, 10, 10, 0.9);
        --drop-fade: rgba(10, 10, 10, 0.1);
        --ripple: rgba(10, 10, 10, 0.45);
        --surface-line: rgba(10, 10, 10, 0.14);
        --surface-glow: rgba(10, 10, 10, 0.08);
        --halo: rgba(10, 10, 10, 0.05);
        --surface: 74vh;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --ink: #ffffff;
          --muted: #9a9a9a;
          --accent: #ffffff;
          --drop-core: rgba(255, 255, 255, 0.92);
          --drop-fade: rgba(255, 255, 255, 0.14);
          --ripple: rgba(255, 255, 255, 0.5);
          --surface-line: rgba(255, 255, 255, 0.18);
          --surface-glow: rgba(255, 255, 255, 0.1);
          --halo: rgba(255, 255, 255, 0.06);
        }
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html {
        text-rendering: optimizeLegibility;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: "Space Grotesk", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .halo {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            58% 58% at 50% 44%,
            var(--halo),
            transparent 70%
          );
        animation: breathe 9s ease-in-out infinite;
      }

      .water {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .drop,
      .ripple,
      .splash {
        position: absolute;
        left: var(--x);
        top: var(--surface);
        opacity: 0;
      }

      .drop {
        width: 11px;
        height: 17px;
        margin-left: -5.5px;
        margin-top: -8px;
        border-radius: 50% 50% 50% 0;
        background: linear-gradient(165deg, var(--drop-core), var(--drop-fade));
        box-shadow: 0 0 10px var(--drop-fade);
        animation: fall var(--dur) var(--delay) ease-in infinite;
      }

      .drop::after {
        content: "";
        position: absolute;
        top: 14%;
        left: 18%;
        width: 26%;
        height: 26%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
      }

      .ripple {
        width: 90px;
        height: 90px;
        margin-left: -45px;
        margin-top: -45px;
        border: 1px solid var(--ripple);
        border-radius: 50%;
        animation: ripple var(--dur) var(--delay) ease-out infinite;
      }

      .splash {
        width: 10px;
        height: 10px;
        margin-left: -5px;
        margin-top: -5px;
        border-radius: 50%;
        background: var(--ripple);
        animation: splash var(--dur) var(--delay) ease-out infinite;
      }

      .surface {
        position: fixed;
        left: 0;
        right: 0;
        top: var(--surface);
        height: 1px;
        z-index: 0;
        background: var(--surface-line);
        box-shadow: 0 0 24px 4px var(--surface-glow);
      }

      .e1 {
        --x: 16%;
        --dur: 7.5s;
        --delay: 0.6s;
      }

      .e2 {
        --x: 78%;
        --dur: 9.2s;
        --delay: 3.1s;
      }

      .e3 {
        --x: 38%;
        --dur: 8.1s;
        --delay: 5.4s;
      }

      .e4 {
        --x: 61%;
        --dur: 8.8s;
        --delay: 7.2s;
      }

      main {
        position: relative;
        z-index: 1;
        max-width: 40rem;
        text-align: center;
      }

      main > * {
        animation: rise 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .eyebrow {
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--muted);
        animation-delay: 60ms;
      }

      .eyebrow::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-right: 0.7em;
        border-radius: 50%;
        vertical-align: 2px;
        background: var(--accent);
        animation: pulse 2.4s ease-in-out infinite;
      }

      .title {
        margin-top: 1.4rem;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2.6rem, 10vw, 4.75rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.015em;
        animation-delay: 140ms;
      }

      .title em {
        font-style: italic;
      }

      .sub {
        margin-top: 1.1rem;
        font-size: 1.02rem;
        color: var(--muted);
        animation-delay: 260ms;
      }

      .note {
        margin-top: 2.4rem;
        font-size: 0.9rem;
        animation-delay: 380ms;
      }

      .note a {
        color: var(--accent);
        text-decoration: none;
        padding-bottom: 2px;
        background-image: linear-gradient(currentColor, currentColor);
        background-size: 0% 1px;
        background-repeat: no-repeat;
        background-position: 0 100%;
        transition: background-size 220ms ease;
      }

      .note a:hover,
      .note a:focus-visible {
        background-size: 100% 1px;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        border-radius: 2px;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.07);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes fall {
        0% {
          transform: translateY(-46vh) rotate(-45deg);
          opacity: 0;
        }
        5% {
          opacity: 1;
        }
        26% {
          transform: translateY(0) rotate(-45deg);
          opacity: 1;
        }
        30% {
          transform: translateY(0) rotate(-45deg);
          opacity: 0;
        }
        100% {
          transform: translateY(0) rotate(-45deg);
          opacity: 0;
        }
      }

      @keyframes ripple {
        0% {
          transform: scale(0.05);
          opacity: 0;
        }
        26% {
          transform: scale(0.16);
          opacity: 0.6;
        }
        100% {
          transform: scale(1.8);
          opacity: 0;
        }
      }

      @keyframes splash {
        0% {
          transform: scale(0.2);
          opacity: 0;
        }
        24% {
          transform: scale(0.3);
          opacity: 0.4;
        }
        27% {
          transform: scale(1.05);
          opacity: 0.9;
        }
        34% {
          transform: scale(1.7);
          opacity: 0;
        }
        100% {
          transform: scale(1.7);
          opacity: 0;
        }
      }

      @media (prefers-color-scheme: dark) {
        .title {
          text-shadow: 0 0 40px rgba(255, 255, 255, 0.12);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .halo,
        .water,
        .surface,
        .eyebrow::before {
          display: none;
        }

        main > * {
          animation: none;
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="halo" aria-hidden="true"></div>
    <div class="water" aria-hidden="true">
      <span class="drop e1"></span>
      <span class="drop e2"></span>
      <span class="drop e3"></span>
      <span class="drop e4"></span>
      <span class="ripple e1"></span>
      <span class="ripple e2"></span>
      <span class="ripple e3"></span>
      <span class="ripple e4"></span>
      <span class="splash e1"></span>
      <span class="splash e2"></span>
      <span class="splash e3"></span>
      <span class="splash e4"></span>
    </div>
    <div class="surface" aria-hidden="true"></div>
    <main>
      <p class="eyebrow">benslogs.dev</p>
      <h1 class="title">Bens<em>Logs</em></h1>
      <p class="sub">Fresh logs, dropping soon.</p>
      <p class="note">
        <a href="/old/">Previous site ↗</a>
      </p>
    </main>
  </body>
</html>
